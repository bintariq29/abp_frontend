<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h3><i class="fas fa-box"></i> Products</h3>
        <a routerLink="/products/create" class="btn btn-primary">
            <i class="fas fa-plus"></i> Create Product
        </a>
    </div>

    <div class="card-body table-responsive table-striped table-bordered">
        <div class="primeng-datatable-container">
            <p-table #dataTable sortMode="multiple" (onLazyLoad)="list($event)" [value]="primengTableHelper.records"
                rows="{{ primengTableHelper.defaultRecordsCountPerPage }}" [paginator]="false" [lazy]="true"
                [tableStyle]="{ 'min-width': '50rem' }">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="min-width: 100px" pSortableColumn="id">
                            ID
                            <p-sortIcon field="id"></p-sortIcon>
                        </th>
                        <th style="min-width: 150px" pSortableColumn="name">
                            Name
                            <p-sortIcon field="name"></p-sortIcon>
                        </th>
                        <th style="min-width: 100px" pSortableColumn="price">
                            Price
                            <p-sortIcon field="price"></p-sortIcon>
                        </th>
                        <th style="min-width: 130px">
                            Actions
                        </th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-record="$implicit">
                    <tr>
                        <td>
                            <span>
                                {{ record.id }}
                            </span>
                        </td>
                        <td>
                            <span>
                                {{ record.name }}
                            </span>
                        </td>
                        <td>
                            <span>
                                {{ record.price | currency }}
                            </span>
                        </td>
                        <td>
                            <button type="button" class="btn btn-sm btn-warning" (click)="editProduct(record.id)">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button type="button" class="btn btn-sm btn-danger mx-2" (click)="delete(record)">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
            <div class="primeng-no-data" *ngIf="primengTableHelper.totalRecordsCount == 0">
                No Data
            </div>
            <div class="ui-table-footer"></div>
        </div>
    </div>
    <div class="card-footer table-card-footer bg-white border-top">
        <div class="row">
            <div class="col-sm-4 col-12 text-sm-left text-center">
                <button class="btn btn-secondary" (click)="refresh()">
                    <i class="fas fa-redo-alt"></i>
                </button>
            </div>
            <div class="col-sm-8 col-12">
                <div class="float-sm-right m-auto">
                    <div class="primeng-paging-container">
                        <p-paginator [rows]="primengTableHelper.defaultRecordsCountPerPage" #paginator
                            (onPageChange)="list($event)" [totalRecords]="primengTableHelper.totalRecordsCount"
                            [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage"
                            [showCurrentPageReport]="true"
                            currentPageReportTemplate="Total: {totalRecords}"></p-paginator>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
