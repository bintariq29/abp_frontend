<h2>Product List</h2>

<a routerLink="/products/create" class="btn btn-primary">Create New Product</a>

<div *ngFor="let product of products"
    style="border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 5px;">
    <h3>{{ product.name }}</h3>
    <p>Price: {{ product.price | currency }}</p>
    <button (click)="editProduct(product.id)" class="btn btn-sm btn-warning">Edit</button>
    <button (click)="deleteProduct(product.id)" class="btn btn-sm btn-danger">Delete</button>
</div>
