<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="m-0 text-dark font-weight-bold">Books</h2>
        </div>

        <div>
            <button class="btn btn-primary px-4 shadow-sm" (click)="createBook()">
                <i class="fa fa-plus me-2"></i>Create Book
            </button>
        </div>

    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="container-fluid mt-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>Books Management</h2>
                    <button class="btn btn-primary" (click)="createBook()">
                        <i class="fa fa-plus"></i> Add New Book
                    </button>
                </div>

                <div *ngIf="isLoading" class="text-center my-5">
                    <div class="spinner-border text-primary"></div>
                    <p>Fetching Data...</p>
                </div>

                <div class="card shadow-sm" *ngIf="!isLoading">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Price</th>
                                    <th>Status</th>
                                    <th *ngIf="isAdmin">Requests</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of combineDataList">
                                    <td>{{ item.id }}</td>
                                    <td>{{ item.name }}</td>
                                    <td>{{ item.price | currency }}</td>

                                    <td>
                                        <span class="badge"
                                            [ngClass]="item.requestDetails ? 'bg-warning' : 'bg-success'">
                                            {{ item.requestDetails ? item.requestDetails.status : 'Available' }}
                                        </span>
                                    </td>

                                    <td *ngIf="isAdmin">
                                        <button *ngIf="item.requestDetails" class="btn btn-sm btn-info"
                                            (click)="viewRequest(item.requestDetails)">
                                            View Request
                                        </button>
                                        <span *ngIf="!item.requestDetails" class="text-muted small">No Requests</span>
                                    </td>

                                    <td>
                                        <div *ngIf="isAdmin">
                                            <button class="btn btn-sm btn-outline-primary me-1">Edit</button>
                                            <button class="btn btn-sm btn-outline-danger">Delete</button>
                                        </div>

                                        <div *ngIf="!isAdmin">
                                            <button class="btn btn-sm btn-outline-primary me-1">Edit Request</button>

                                            <button *ngIf="!item.requestDetails" class="btn btn-sm btn-success">
                                                Add Request
                                            </button>
                                            <button *ngIf="item.requestDetails" class="btn btn-sm btn-danger">
                                                Withdraw Request
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
