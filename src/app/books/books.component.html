<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="m-0 text-dark font-weight-bold">Books</h2>
        </div>

        <div *ngIf="isAdmin==true">
            <button class="btn btn-primary px-4 shadow-sm" (click)="createBook()">
                <i class="fa fa-plus me-2"></i>Create Book
            </button>
        </div>

    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="container-fluid mt-4">
                <div *ngIf="isLoading" class="text-center my-5">
                    <div class="spinner-border text-primary"></div>
                    <p>Fetching Data...</p>
                </div>

                <div class="card shadow-sm" *ngIf="!isLoading">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th>Book Id</th>
                                    <th>Book Name</th>
                                    <th>Stock</th>
                                    <th>Price</th>
                                    <th *ngIf="!isAdmin">Status</th>
                                    <th *ngIf="isAdmin">Requests</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of combineDataList">
                                    <td>{{ item.id }}</td>
                                    <td>{{ item.title }}</td>
                                    <td>{{ item.st }}</td>
                                    <td>{{ item.price | currency }}</td>

                                    <td *ngIf="!isAdmin">
                                        <span *ngIf="!item.requestDetails" class="badge bg-secondary">
                                            N/A
                                        </span>

                                        <span *ngIf="item.requestDetails" class="badge" [ngClass]="{
        'bg-warning text-dark': item.requestDetails.status === 'Pending',
        'bg-success': item.requestDetails.status === 'Accepted' || item.requestDetails.status === 'Approved',
        'bg-danger': item.requestDetails.status === 'Rejected'
    }">
                                            {{ item.requestDetails.status }}
                                        </span>
                                    </td>

                                    <td *ngIf="isAdmin">
                                        <button *ngIf="item.requestDetails" class="btn btn-sm btn-info"
                                            (click)="viewRequest(item.requestDetails)">
                                            View Request
                                        </button>
                                        <span *ngIf="!item.requestDetails" class="text-muted small">No Requests</span>
                                    </td>

                                    <td>
                                        <div *ngIf="!isAdmin" class="d-flex flex-wrap gap-2">

                                            <button *ngIf="!item.requestDetails"
                                                class="btn btn-sm btn-outline-success mx-2" (click)="addRequest(item)">
                                                <i class="fas fa-plus me-1"></i> Add Request
                                            </button>

                                            <button
                                                *ngIf="item.requestDetails?.status === 'Pending' || item.requestDetails?.status === 'Rejected'"
                                                class="btn btn-sm btn-outline-primary mx-2"
                                                (click)="editRequest(item.requestDetails, item.id)">
                                                <i class="fas fa-pencil-alt me-1"></i> Edit Request
                                            </button>

                                            <button
                                                *ngIf="item.requestDetails?.status === 'Pending' || item.requestDetails?.status === 'Rejected'"
                                                class="btn btn-sm btn-outline-danger mx-2"
                                                (click)="withdrawRequest(item.requestDetails.requestId, item.title, item)">
                                                <i class="fas fa-times me-1"></i> Withdraw Request
                                            </button>

                                            <button *ngIf="item.requestDetails?.status === 'Accepted'"
                                                class="btn btn-sm btn-outline-info mx-2"
                                                (click)="withdrawRequest(item.requestDetails.requestId, item.title, item)">
                                                <i class="fas fa-undo me-1"></i> Return
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
