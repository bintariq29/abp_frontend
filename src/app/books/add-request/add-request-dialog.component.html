<form novalidate autocomplete="off" #requestForm="ngForm" (ngSubmit)="save()">
    <div class="modal-header">
        <h4 class="modal-title">
            <span>Confirm Your Request</span>
        </h4>
        <button type="button" class="btn-close" (click)="bsModalRef.hide()"></button>
    </div>

    <div class="modal-body">
        <div class="form-group mb-3">
            <label class="form-label">Book Name</label>
            <input type="text" class="form-control" name="bookTitle" [ngModel]="bookDetails.title" readonly>
        </div>

        <div class="form-group mb-3">
            <label class="form-label">User Name</label>
            <input type="text" class="form-control" name="userName" [ngModel]="userDetails.userName" readonly>
        </div>

        <div class="form-group mb-3">
            <label class="form-label">Email ID</label>
            <input type="text" class="form-control" name="email" [ngModel]="userDetails.emailAddress" readonly>
        </div>

        <div class="form-group mb-3">
            <label class="form-label">Request Date</label>
            <input type="text" class="form-control" name="date" [ngModel]="currentDateTime | date:'medium'" readonly>
        </div>

        <div class="form-group mb-3">
            <label class="form-label">Request Days</label>
            <input type="number" class="form-control" name="requestDays" 
                [(ngModel)]="request.requestDays" required #daysModel="ngModel"
                [ngClass]="{ 'is-invalid': daysModel.touched && daysModel.invalid }"
                min="1" placeholder="Enter number of days">
            <div class="invalid-feedback">Please enter valid days (minimum 1).</div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!requestForm.form.valid || saving">
            {{ saving ? 'Submitting...' : 'Send Request' }}
        </button>
    </div>
</form>
