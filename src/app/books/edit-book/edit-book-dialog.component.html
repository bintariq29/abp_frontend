<form novalidate autocomplete="off" #editBookForm="ngForm" (ngSubmit)="save()">
    <div class="modal-header">
        <h4 class="modal-title">
            <span>Edit Book</span>
        </h4>
        <button type="button" class="btn-close" (click)="bsModalRef.hide()"></button>
    </div>

    <div class="modal-body">
        <div class="form-group mb-3">
            <label class="form-label">Book Title</label>
            <input type="text" class="form-control" name="title" [(ngModel)]="book.title" readonly
                style="background-color: #e9ecef;">
            <small class="text-muted">Title cannot be edited.</small>
        </div>

        <div class="form-group mb-3">
            <label class="form-label">Price</label>
            <input type="number" class="form-control" name="price" [(ngModel)]="book.price" required
                #priceModel="ngModel" [ngClass]="{ 'is-invalid': priceModel.touched && priceModel.invalid }">
            <div class="invalid-feedback">Price is required.</div>
        </div>

        <div class="form-group mb-3">
            <label class="form-label">Update Stock</label>
            <input type="number" class="form-control" name="stock" [(ngModel)]="book.stock" required
                #stockModel="ngModel" [ngClass]="{ 'is-invalid': stockModel.touched && stockModel.invalid }" min="0">
            <div class="invalid-feedback">Stock is required.</div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!editBookForm.form.valid || saving">
            Update Changes
        </button>
    </div>
</form>
